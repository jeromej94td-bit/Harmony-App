name: Apply Pizza Burger tension question

on:
  push:
    branches:
      - fix/pizza-burger-tension

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, 'fix: sharpen Pizza vs Burger question') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pizza-burger-tension
          fetch-depth: 0

      - name: Apply source edit
        run: python .github/scripts/apply_pizza_burger_tension.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:test --stacktrace

      - name: Commit production fix
        run: |
          rm -f .github/scripts/apply_pizza_burger_tension.py
          rm -f .github/workflows/apply-pizza-burger-tension.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sharpen Pizza vs Burger question"
          git push origin HEAD:fix/pizza-burger-tension
