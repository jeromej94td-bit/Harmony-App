name: Apply Nähe Cinematic Glitch

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply_naehe_cinematic_glitch.py'
      - 'scripts/verify_naehe_cinematic_glitch.py'
      - '.github/workflows/apply-naehe-cinematic-glitch.yml'

permissions:
  contents: write

jobs:
  apply-verify-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply cinematic implementation
        run: python3 scripts/apply_naehe_cinematic_glitch.py

      - name: Verify cinematic source requirements
        run: python3 scripts/verify_naehe_cinematic_glitch.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit verified implementation and clean helpers
        run: |
          git config user.name "harmony-cinematic-glitch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          git rm scripts/apply_naehe_cinematic_glitch.py
          git rm scripts/verify_naehe_cinematic_glitch.py
          git rm .github/workflows/apply-naehe-cinematic-glitch.yml
          git commit -m "feat: cinematic Nähe transformer materialization"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying"
            sleep 3
          done
          exit 1
