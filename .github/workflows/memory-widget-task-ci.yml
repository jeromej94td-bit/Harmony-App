name: Memory Widget Task CI

on:
  push:
    branches:
      - feat/memory-home-widget-v2
  pull_request:
    branches:
      - ci/memory-widget-base

permissions:
  contents: read

jobs:
  task-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run Memory widget task tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests 'com.example.widget.MemoryWidgetLogicTest' \
            --tests 'com.example.widget.MemoryWidgetPreferencesTest' \
            --tests 'com.example.widget.MemoryWidgetIntentsTest' \
            --tests 'com.example.ui.memory.MemoryViewModelTest' \
            --no-daemon
