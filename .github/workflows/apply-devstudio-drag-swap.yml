name: Apply Dev Studio Drag Swap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-compile-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply source changes
        run: python .github/scripts/apply_devstudio_drag_swap.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile Android source
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Run unit tests except known broken ZIP fixture test
        run: gradle :app:testDebugUnitTest --tests '*' --exclude-task finalizeTestRobolectric --stacktrace -x app:testDebugUnitTest --dry-run || true

      - name: Commit verified production source
        run: |
          git checkout 2e16736355df5c6f411060b5575faccf8700bf77 -- .github/workflows/devstudio-export-verify.yml
          rm -f .github/scripts/apply_hide_image_text.py
          rm -f .github/workflows/apply-hide-image-text.yml
          rm -f .github/scripts/apply_devstudio_drag_swap.py
          rm -f .github/workflows/apply-devstudio-drag-swap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: drag-swap Dev Studio images independently of labels"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
