name: Install Drive TOT assets

on:
  push:
    branches:
      - agent/drive-tot-categories
    paths:
      - 'app/src/main/assets/drive_tot_assets.zip'
      - 'scripts/install_drive_tot_assets.py'
      - '.github/workflows/install-drive-tot-assets.yml'

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/drive-tot-categories
          fetch-depth: 0

      - name: Install Drive images into Android drawables
        run: python3 scripts/install_drive_tot_assets.py

      - name: Verify expected output
        run: |
          test ! -f app/src/main/assets/drive_tot_assets.zip
          test -f app/src/main/res/drawable/drink_cappuccino.webp
          test -f app/src/main/res/drawable/animal_hund.webp
          test -f app/src/main/res/drawable/hobby_gitarre.webp
          test -f app/src/main/res/drawable/travel_tokyo.webp
          grep -q '"Gitarre spielen" to R.drawable.hobby_gitarre' app/src/main/java/com/example/ui/components/TotImageProvider.kt
          grep -q '"Tokyo, Japan" to R.drawable.travel_tokyo' app/src/main/java/com/example/ui/components/TotImageProvider.kt

      - name: Commit generated drawable assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: install Drive Das-oder-das images as local drawables" || exit 0
          git push origin HEAD:agent/drive-tot-categories
