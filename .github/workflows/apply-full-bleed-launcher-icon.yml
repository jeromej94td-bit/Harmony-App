name: Apply Full-Bleed Launcher Icon

on:
  push:
    branches:
      - fix/full-bleed-launcher-icon
    paths:
      - 'scripts/launcher_icon_src_part*.b64'
      - '.github/workflows/apply-full-bleed-launcher-icon.yml'

permissions:
  contents: write

jobs:
  build-launcher-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-bleed-launcher-icon
          fetch-depth: 0

      - name: Reconstruct full-bleed source
        run: |
          cat scripts/launcher_icon_src_part1.b64 \
              scripts/launcher_icon_src_part2.b64 \
              scripts/launcher_icon_src_part3.b64 \
              scripts/launcher_icon_src_part4.b64 \
              scripts/launcher_icon_src_part5.b64 \
              scripts/launcher_icon_src_part6.b64 \
              | base64 --decode > /tmp/harmony_launcher.webp
          file /tmp/harmony_launcher.webp

      - name: Ensure ImageMagick is available
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Generate Android launcher assets
        shell: bash
        run: |
          set -euo pipefail
          RES=app/src/main/res
          mkdir -p "$RES/drawable-nodpi" \
                   "$RES/drawable" \
                   "$RES/mipmap-mdpi" \
                   "$RES/mipmap-hdpi" \
                   "$RES/mipmap-xhdpi" \
                   "$RES/mipmap-xxhdpi" \
                   "$RES/mipmap-xxxhdpi"

          # Adaptive-icon background: edge-to-edge artwork. The launcher mask is the only crop.
          cp /tmp/harmony_launcher.webp "$RES/drawable-nodpi/ic_launcher_full.webp"

          cat > "$RES/drawable/ic_launcher_transparent_foreground.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#00000000"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_full" />
              <foreground android:drawable="@drawable/ic_launcher_transparent_foreground" />
          </adaptive-icon>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_full" />
              <foreground android:drawable="@drawable/ic_launcher_transparent_foreground" />
          </adaptive-icon>
          EOF

          make_icons() {
            local density="$1"
            local size="$2"
            local dir="$RES/mipmap-$density"
            convert /tmp/harmony_launcher.webp -resize "${size}x${size}!" -quality 96 "$dir/ic_launcher.webp"
            # Pre-Android-8 round fallback: image fills the circle; outside stays transparent, never black.
            convert /tmp/harmony_launcher.webp -resize "${size}x${size}!" \
              \( +clone -alpha extract -threshold 0 -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),0" \) \
              -alpha off -compose CopyOpacity -composite -quality 96 "$dir/ic_launcher_round.webp"
          }

          make_icons mdpi 48
          make_icons hdpi 72
          make_icons xhdpi 96
          make_icons xxhdpi 144
          make_icons xxxhdpi 192

      - name: Verify generated icon dimensions and full-bleed source
        run: |
          set -e
          identify app/src/main/res/drawable-nodpi/ic_launcher_full.webp
          identify app/src/main/res/mipmap-mdpi/ic_launcher.webp
          identify app/src/main/res/mipmap-hdpi/ic_launcher.webp
          identify app/src/main/res/mipmap-xhdpi/ic_launcher.webp
          identify app/src/main/res/mipmap-xxhdpi/ic_launcher.webp
          identify app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          grep -q '@drawable/ic_launcher_full' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/ic_launcher_full' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Android resources
        run: gradle :app:processDebugResources --no-daemon

      - name: Commit verified launcher icon and remove staging helpers
        run: |
          git config user.name "harmony-icon-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/launcher_icon_src_part1.b64 \
                 scripts/launcher_icon_src_part2.b64 \
                 scripts/launcher_icon_src_part3.b64 \
                 scripts/launcher_icon_src_part4.b64 \
                 scripts/launcher_icon_src_part5.b64 \
                 scripts/launcher_icon_src_part6.b64 \
                 .github/workflows/apply-full-bleed-launcher-icon.yml
          git add app/src/main/res/drawable-nodpi/ic_launcher_full.webp \
                  app/src/main/res/drawable/ic_launcher_transparent_foreground.xml \
                  app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
                  app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml \
                  app/src/main/res/mipmap-mdpi/ic_launcher.webp \
                  app/src/main/res/mipmap-mdpi/ic_launcher_round.webp \
                  app/src/main/res/mipmap-hdpi/ic_launcher.webp \
                  app/src/main/res/mipmap-hdpi/ic_launcher_round.webp \
                  app/src/main/res/mipmap-xhdpi/ic_launcher.webp \
                  app/src/main/res/mipmap-xhdpi/ic_launcher_round.webp \
                  app/src/main/res/mipmap-xxhdpi/ic_launcher.webp \
                  app/src/main/res/mipmap-xxhdpi/ic_launcher_round.webp \
                  app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp \
                  app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.webp
          git commit -m "feat: replace launcher with full-bleed Harmony icon"
          git push origin HEAD:fix/full-bleed-launcher-icon
