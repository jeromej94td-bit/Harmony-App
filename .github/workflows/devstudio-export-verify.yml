name: Dev Studio Export Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test-stable-images:
    if: ${{ !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply stable image patch when needed
        shell: bash
        run: |
          if [ ! -f app/src/main/java/com/example/data/StableTotImageBindings.kt ]; then
            git apply --check .github/patches/stable-tot-image-bindings.patch
            git apply .github/patches/stable-tot-image-bindings.patch
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:test --stacktrace

      - name: Commit tested production fix
        shell: bash
        run: |
          if [ -f .github/patches/stable-tot-image-bindings.patch ]; then
            git fetch origin main
            git checkout origin/main -- .github/workflows/devstudio-export-verify.yml
            rm -f .github/patches/stable-tot-image-bindings.patch
            rm -f .github/workflows/apply-stable-tot-image-bindings.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: decouple Das-oder-das images from labels"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
