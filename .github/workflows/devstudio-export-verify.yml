name: Dev Studio Export Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test-hide-image-text:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Dev Studio image-text fix
        run: python .github/scripts/apply_hide_image_text.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:test --stacktrace

      - name: Commit tested production fix
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/devstudio-export-verify.yml
          rm -f .github/scripts/apply_hide_image_text.py
          rm -f .github/workflows/apply-hide-image-text.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep Drive images when labels change or hide"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
