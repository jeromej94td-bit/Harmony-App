name: Localization Audit

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/example/ui/**'
      - 'app/src/main/java/com/example/widget/**'
      - 'app/src/main/java/com/example/MainActivity.kt'
      - 'scripts/audit_localization.py'
      - 'scripts/repair_build_blockers.py'
      - 'scripts/verify_localization_repair.py'
      - 'scripts/verify_ptbr_ready.py'
      - 'scripts/verify_six_new_locales.py'
      - '.github/workflows/localization-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify pt-BR readiness
        run: python3 scripts/verify_ptbr_ready.py

      - name: Verify six new locales readiness
        run: python3 scripts/verify_six_new_locales.py

      - name: Repair concrete Kotlin build blockers
        run: python3 scripts/repair_build_blockers.py

      - name: Audit all source catalogs
        run: python3 scripts/audit_localization.py

      - name: Verify effective localization
        run: python3 scripts/verify_localization_repair.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Persist deterministic source repairs
        run: |
          git config user.name "harmony-localization-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui app/src/main/java/com/example/widget
          if ! git diff --cached --quiet; then
            git commit -m "Fix localization source issues"
            git push origin HEAD:${{ github.head_ref }}
          fi
