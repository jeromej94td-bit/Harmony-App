name: Localization Audit

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/example/ui/**'
      - 'app/src/main/java/com/example/MainActivity.kt'
      - 'scripts/audit_localization.py'
      - 'scripts/generate_localization_updates.py'
      - '.github/workflows/localization-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check complete customer localization
        id: localization
        continue-on-error: true
        run: python3 scripts/audit_localization.py
      - name: Generate missing translation updates
        run: python3 scripts/generate_localization_updates.py
      - name: Upload missing-key report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-missing
          path: localization_missing.json
      - name: Upload generated translation updates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-generated
          path: generated-localization-updates.kt
      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-source-snapshot
          path: |
            app/src/main/java/com/example/MainActivity.kt
            app/src/main/java/com/example/ui/TranslationCatalog.kt
            app/src/main/java/com/example/ui/Language.kt
            app/src/main/java/com/example/ui/components/CommonUI.kt
            app/src/main/java/com/example/ui/screens/ChatScreen.kt
            app/src/main/java/com/example/ui/screens/GamesScreen.kt
            app/src/main/java/com/example/ui/screens/PandaEitherOrScreen.kt
            app/src/main/java/com/example/ui/screens/MomentsScreen.kt
            app/src/main/java/com/example/ui/introspection/IntrospectionStrings.kt
      - name: Fail when localization is incomplete
        if: steps.localization.outcome == 'failure'
        run: exit 1
