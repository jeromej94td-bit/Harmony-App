name: Localization Audit

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/example/ui/**'
      - 'app/src/main/java/com/example/widget/**'
      - 'app/src/main/java/com/example/MainActivity.kt'
      - 'scripts/audit_localization.py'
      - 'scripts/generate_localization_updates.py'
      - 'scripts/apply_localization_repairs.py'
      - 'scripts/finalize_localization_repair.py'
      - 'scripts/repair_build_blockers.py'
      - 'scripts/verify_localization_repair.py'
      - '.github/workflows/localization-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify effective localization
        id: effective
        continue-on-error: true
        run: python3 scripts/verify_localization_repair.py

      - name: Audit source catalogs
        if: steps.effective.outcome == 'failure'
        run: python3 scripts/audit_localization.py || true

      - name: Generate missing translation updates
        if: steps.effective.outcome == 'failure'
        run: python3 scripts/generate_localization_updates.py

      - name: Apply localization repair
        if: steps.effective.outcome == 'failure'
        run: |
          cp generated-localization-updates.kt app/src/main/java/com/example/ui/LocalizationUpdates.kt
          python3 scripts/apply_localization_repairs.py
          python3 scripts/finalize_localization_repair.py

      - name: Repair concrete Kotlin build blockers
        run: python3 scripts/repair_build_blockers.py

      - name: Verify repaired localization
        run: python3 scripts/verify_localization_repair.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit localization repair
        if: steps.effective.outcome == 'failure'
        run: |
          git config user.name "harmony-localization-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt app/src/main/java/com/example/ui app/src/main/java/com/example/widget
          if ! git diff --cached --quiet; then
            git commit -m "Complete customer-facing localizations"
            git push origin HEAD:${{ github.head_ref }}
          fi
