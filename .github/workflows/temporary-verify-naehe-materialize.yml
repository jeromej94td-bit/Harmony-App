name: Temporary Verify Nähe Materialize

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/verify_naehe_materialize_animation.py'
      - 'app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify targeted animation behavior
        run: python3 scripts/verify_naehe_materialize_animation.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon
