name: Temporary Verify Nähe Materialize

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify targeted animation behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt').read_text(encoding='utf-8')
          required = [
              'private fun MaterializeInEntrance(',
              'val isIntimacyPack = pack.id == "naehe" && pack.topic == "sex"',
              'animationKey = questionAnimationKey',
              'delayMillis = 130 + optIdx * 65',
              'shape = RoundedCornerShape(24.dp)',
              'shape = RoundedCornerShape(18.dp)',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('Missing Nähe materialize markers: ' + ', '.join(missing))
          if text.count('val isIntimacyPack = pack.id == "naehe" && pack.topic == "sex"') != 1:
              raise SystemExit('Nähe animation guard must occur exactly once')
          print('Nähe materialize source invariants verified')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon
