name: Apply Tot Final Transition Fix

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_tot_final_transition_fix.py'

permissions:
  contents: write

jobs:
  patch-verify-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply minimal transition patch
        run: python3 scripts/apply_tot_final_transition_fix.py

      - name: Verify final transition regression
        run: python3 scripts/verify_tot_no_final_reentry.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit minimal fix and remove one-shot helpers
        run: |
          git config user.name "harmony-transition-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          git rm scripts/apply_tot_final_transition_fix.py
          git rm .github/workflows/apply-tot-final-transition-fix.yml
          git commit -m "fix: remove final Das-oder-das converge and re-entry"
          git push origin HEAD:main
