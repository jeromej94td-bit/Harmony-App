name: Verify Nähe Sand Particles

on:
  push:
    branches:
      - feat/naehe-sand-particles-v3
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply micro-sand particle implementation
        run: python3 scripts/apply_naehe_sand_particles.py

      - name: Verify micro-sand particle requirements
        run: python3 scripts/verify_naehe_sand_particles.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Upload verified QuizRunner
        uses: actions/upload-artifact@v4
        with:
          name: naehe-sand-quizrunner
          path: app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          if-no-files-found: error

      - name: Persist verified QuizRunner
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt; then
            echo "Verified QuizRunner already persisted"
            exit 0
          fi
          git config user.name "harmony-sand-particle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          git commit -m "feat: materialize Nähe UI from micro sand particles"
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/naehe-sand-particles-v3
            git rebase origin/feat/naehe-sand-particles-v3
            if git push origin HEAD:feat/naehe-sand-particles-v3; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying"
            sleep 3
          done
          exit 1
