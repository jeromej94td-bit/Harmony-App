name: Memory Widget Final CI

on:
  pull_request:
    branches:
      - ci/memory-widget-base

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Stabilize pre-existing concurrent preview test harness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/test/java/com/example/ui/memory/MemoryViewModelTest.kt')
          text = path.read_text()
          marker = 'fun `concurrent preview failures atomically retain every failed entry id`()'
          test_start = text.index(marker)
          test_end = text.index('\n    @Test', test_start)
          block = text[test_start:test_end]

          if 'val failuresPublished = CountDownLatch(entryCount)' not in block:
              create_pattern = re.compile(
                  r'(?m)^(\s*)val viewModel = MemoryViewModel\(repository, concurrentResolver, clock, concurrentDispatcher\)\n'
                  r'\1    \.also \{ viewModelStore\.put\("concurrent", it\) \}'
              )
              def replace_create(match):
                  i = match.group(1)
                  return (
                      f'{i}val failuresPublished = CountDownLatch(entryCount)\n'
                      f'{i}val viewModel = MemoryViewModel(\n'
                      f'{i}    repository,\n'
                      f'{i}    concurrentResolver,\n'
                      f'{i}    clock,\n'
                      f'{i}    concurrentDispatcher,\n'
                      f'{i}    onMemoryChanged = failuresPublished::countDown\n'
                      f'{i}).also {{ viewModelStore.put("concurrent", it) }}'
                  )
              block, create_count = create_pattern.subn(replace_create, block, count=1)
              if create_count != 1:
                  raise SystemExit(f'Expected ViewModel creation pattern once, found {create_count}')

              wait_pattern = re.compile(
                  r'(?m)^(\s*)release\.complete\(Unit\)\n'
                  r'\1val queuedWorkDrained = CountDownLatch\(entryCount\)\n'
                  r'\1repeat\(entryCount\) \{ executor\.execute\(queuedWorkDrained::countDown\) \}\n'
                  r'\1queuedWorkDrained\.await\(\)\n'
                  r'\1runCurrent\(\)'
              )
              def replace_wait(match):
                  i = match.group(1)
                  return (
                      f'{i}release.complete(Unit)\n'
                      f'{i}assertTrue(failuresPublished.await(10, java.util.concurrent.TimeUnit.SECONDS))\n'
                      f'{i}runCurrent()'
                  )
              block, wait_count = wait_pattern.subn(replace_wait, block, count=1)
              if wait_count != 1:
                  raise SystemExit(f'Expected queue-drain pattern once, found {wait_count}')

              path.write_text(text[:test_start] + block + text[test_end:])
          PY
      - name: Run all Memory widget and ViewModel tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests 'com.example.widget.*' \
            --tests 'com.example.ui.memory.MemoryViewModelTest' \
            --no-daemon
      - name: Run existing Memory regression tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests 'com.example.ui.MemoryPinboardUiTest' \
            --tests 'com.example.ui.MemoryPinboardScreenshotTest' \
            --tests 'com.example.data.db.MemoryMigrationTest' \
            --no-daemon
      - name: Process Android resources
        run: gradle :app:processDebugResources --no-daemon
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon
      - name: Assemble installable debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: harmony-memory-widget-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
