name: Memory Widget Final CI

on:
  pull_request:
    branches:
      - ci/memory-widget-base

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Stabilize pre-existing concurrent preview test harness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/com/example/ui/memory/MemoryViewModelTest.kt')
          text = path.read_text()
          marker = 'fun `concurrent preview failures atomically retain every failed entry id`()'
          test_start = text.index(marker)
          test_end = text.index('\n    @Test', test_start)
          block = text[test_start:test_end]
          old_create = '''        try {
              val viewModel = MemoryViewModel(repository, concurrentResolver, clock, concurrentDispatcher)
                  .also { viewModelStore.put("concurrent", it) }
          '''
          new_create = '''        try {
              val failuresPublished = CountDownLatch(entryCount)
              val viewModel = MemoryViewModel(
                  repository,
                  concurrentResolver,
                  clock,
                  concurrentDispatcher,
                  onMemoryChanged = failuresPublished::countDown
              ).also { viewModelStore.put("concurrent", it) }
          '''
          old_wait = '''            release.complete(Unit)
              val queuedWorkDrained = CountDownLatch(entryCount)
              repeat(entryCount) { executor.execute(queuedWorkDrained::countDown) }
              queuedWorkDrained.await()
              runCurrent()
          '''
          new_wait = '''            release.complete(Unit)
              assertTrue(failuresPublished.await(10, java.util.concurrent.TimeUnit.SECONDS))
              runCurrent()
          '''
          if 'val failuresPublished = CountDownLatch(entryCount)' not in block:
              if old_create not in block or old_wait not in block:
                  raise SystemExit('Expected test harness pattern not found')
              patched = block.replace(old_create, new_create, 1).replace(old_wait, new_wait, 1)
              path.write_text(text[:test_start] + patched + text[test_end:])
          PY
      - name: Run all Memory widget and ViewModel tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests 'com.example.widget.*' \
            --tests 'com.example.ui.memory.MemoryViewModelTest' \
            --no-daemon
      - name: Run existing Memory regression tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests 'com.example.ui.MemoryPinboardUiTest' \
            --tests 'com.example.ui.MemoryPinboardScreenshotTest' \
            --tests 'com.example.data.db.MemoryMigrationTest' \
            --no-daemon
      - name: Process Android resources
        run: gradle :app:processDebugResources --no-daemon
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon
      - name: Assemble installable debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: harmony-memory-widget-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
