name: PR30 Sync Current Main

on:
  push:
    branches:
      - feat/devstudio-ai-export-v2

permissions:
  contents: write
  issues: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/devstudio-ai-export-v2
          fetch-depth: 0

      - name: Merge current main and resolve known stale overlaps
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main

            set +e
            git merge --no-commit --no-ff origin/main
            merge_rc=$?
            set -e

            if [ "$merge_rc" -ne 0 ]; then
              echo "Merge reported conflicts; resolving known stale overlaps and using three-way merge for text files."
            fi

            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts before resolution:\n%s\n' "${conflicts[*]:-none}"

            for file in "${conflicts[@]}"; do
              case "$file" in
                .github/workflows/devstudio-export-verify.yml|app/src/main/java/com/example/widget/PicShareWidgetPreferences.kt|app/src/test/java/com/example/ui/PandaReworkScreenshotTest.kt)
                  echo "Keeping current main version for stale overlap: $file"
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Attempting three-way text merge: $file"
                  git show ":1:$file" > /tmp/base-file 2>/dev/null || true
                  git show ":2:$file" > /tmp/ours-file 2>/dev/null || true
                  git show ":3:$file" > /tmp/theirs-file 2>/dev/null || true
                  if [ ! -s /tmp/ours-file ] || [ ! -s /tmp/theirs-file ]; then
                    echo "Cannot safely auto-resolve add/delete or binary conflict: $file"
                    exit 20
                  fi
                  set +e
                  git merge-file -p /tmp/ours-file /tmp/base-file /tmp/theirs-file > "$file"
                  file_rc=$?
                  set -e
                  if [ "$file_rc" -ne 0 ]; then
                    echo "Unresolved conflict markers in $file"
                    grep -n -C 8 -E '^(<<<<<<<|=======|>>>>>>>)' "$file" || true
                    exit 21
                  fi
                  git add "$file"
                  ;;
              esac
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved merge conflicts remain:"
              git diff --name-only --diff-filter=U
              exit 22
            fi

            rm -f .github/workflows/pr30-sync-main.yml
            git add -A
            git status --short
            git commit -m "Merge current main into PR 30 after compatibility cleanup"
            git push origin HEAD:feat/devstudio-ai-export-v2
          } 2>&1 | tee /tmp/pr30-sync.log

      - name: Report sync failure to PR 30
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          excerpt="$(tail -n 140 /tmp/pr30-sync.log 2>/dev/null || echo 'No diagnostic log was produced.')"
          {
            echo "PR #30 automatic current-main sync stopped safely."
            echo
            echo '```text'
            printf '%s\n' "$excerpt"
            echo '```'
          } > /tmp/pr30-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/30/comments" -F body=@/tmp/pr30-comment.md
