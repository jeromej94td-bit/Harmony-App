name: Fix Memory Race Test Synchronization

on:
  push:
    branches:
      - feat/memory-home-widget-v2

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-home-widget-v2
      - name: Make concurrent preview test wait for real publications
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/test/java/com/example/ui/memory/MemoryViewModelTest.kt')
          text = path.read_text()
          old = '''        try {
              val viewModel = MemoryViewModel(repository, concurrentResolver, clock, concurrentDispatcher)
                  .also { viewModelStore.put("concurrent", it) }
              runCurrent()
              ids.forEach(viewModel::retryPreview)
              allStarted.await()

              release.complete(Unit)
              val queuedWorkDrained = CountDownLatch(entryCount)
              repeat(entryCount) { executor.execute(queuedWorkDrained::countDown) }
              queuedWorkDrained.await()
              runCurrent()

              assertEquals(ids.toSet(), viewModel.uiState.value.failedPreviewIds)
          } finally {
          '''
          new = '''        try {
              val failuresPublished = CountDownLatch(entryCount)
              val viewModel = MemoryViewModel(
                  repository,
                  concurrentResolver,
                  clock,
                  concurrentDispatcher,
                  onMemoryChanged = failuresPublished::countDown
              ).also { viewModelStore.put("concurrent", it) }
              runCurrent()
              ids.forEach(viewModel::retryPreview)
              allStarted.await()

              release.complete(Unit)
              assertTrue(failuresPublished.await(10, java.util.concurrent.TimeUnit.SECONDS))
              runCurrent()

              assertEquals(ids.toSet(), viewModel.uiState.value.failedPreviewIds)
          } finally {
          '''
          if old not in text:
              if 'val failuresPublished = CountDownLatch(entryCount)' in text:
                  print('Already patched')
                  raise SystemExit(0)
              raise SystemExit('Expected test block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/java/com/example/ui/memory/MemoryViewModelTest.kt
          git commit -m "test: synchronize concurrent Memory preview failures"
          git push origin HEAD:feat/memory-home-widget-v2
