name: Apply Drive TOT content

on:
  push:
    branches:
      - agent/drive-tot-categories

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[drive-tot-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/drive-tot-categories
          fetch-depth: 0
      - name: Apply generated Harmony packs
        run: python3 tools/apply_drive_tot_release.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/example/data/GeneratedHarmonyContent.kt app/src/main/java/com/example/ui/components/TotImageProvider.kt
          if git diff --cached --quiet; then
            echo "No generated changes needed"
          else
            git commit -m "Integrate Drive Das-oder-das packs [drive-tot-applied]"
            git push origin HEAD:agent/drive-tot-categories
          fi
      - name: Compile check when wrapper is available
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:compileDebugKotlin --no-daemon
          else
            echo "Gradle wrapper unavailable; skipped compile check"
          fi
