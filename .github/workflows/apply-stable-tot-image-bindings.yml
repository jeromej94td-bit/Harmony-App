name: Apply stable Das-oder-das image bindings

on:
  push:
    branches:
      - agent/stable-tot-image-bindings

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, 'fix: decouple Das-oder-das images from labels') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/stable-tot-image-bindings
          fetch-depth: 0

      - name: Apply patch
        run: git apply --check .github/patches/stable-tot-image-bindings.patch && git apply .github/patches/stable-tot-image-bindings.patch

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:test --stacktrace

      - name: Commit production fix
        run: |
          rm -f .github/patches/stable-tot-image-bindings.patch
          rm -f .github/workflows/apply-stable-tot-image-bindings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: decouple Das-oder-das images from labels"
          git push origin HEAD:agent/stable-tot-image-bindings
