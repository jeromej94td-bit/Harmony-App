name: Universal intro contract

on:
  push:
    branches:
      - feature/universal-studios-intro
  pull_request:
    paths:
      - 'app/src/main/java/com/example/ui/**'
      - 'app/src/main/res/raw/**'
      - 'app/src/test/java/com/example/ui/UniversalStudiosIntroContractTest.kt'

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run intro contract test
        run: gradle :app:testDebugUnitTest --tests com.example.ui.UniversalStudiosIntroContractTest --stacktrace
