name: Apply Nähe Timing Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'fix: shorten intimacy materialization timing')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply requested timing changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt')
          source = path.read_text(encoding='utf-8')

          old_question = '''animationKey = questionAnimationKey,
                                    delayMillis = 0,
                                    totalDurationMillis = 3_200,
                                    particleCount = 3_000,'''
          new_question = '''animationKey = questionAnimationKey,
                                    delayMillis = 0,
                                    totalDurationMillis = 1_900,
                                    particleCount = 3_000,'''

          old_answers = '''delayMillis = 760 + optIdx * 210,
                                        totalDurationMillis = 2_400,'''
          new_answers = '''delayMillis = 760 + optIdx * 500,
                                        totalDurationMillis = 2_400,'''

          if old_question not in source:
              raise SystemExit('Expected 3.2s intimacy question timing block not found')
          if old_answers not in source:
              raise SystemExit('Expected 210ms answer stagger timing block not found')

          source = source.replace(old_question, new_question, 1)
          source = source.replace(old_answers, new_answers, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Verify requested timing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt').read_text(encoding='utf-8')
          assert 'totalDurationMillis = 1_900' in source
          assert 'delayMillis = 760 + optIdx * 500' in source
          assert 'totalDurationMillis = 2_400' in source
          print('Question = 1.9s; answer stagger = 0.5s; answer duration unchanged.')
          PY
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon
      - name: Commit verified timing and remove helper workflow
        run: |
          git config user.name "harmony-timing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          git rm -f .github/workflows/apply-naehe-timing-main.yml
          git commit -m "fix: shorten intimacy materialization timing"
          git pull --rebase origin main
          git push origin HEAD:main
