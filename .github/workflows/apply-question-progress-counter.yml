name: Apply question progress counters

on:
  push:
    branches:
      - fix/question-progress-counter

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, 'fix: show question progress counters') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/question-progress-counter
          fetch-depth: 0

      - name: Apply patch
        run: git apply --check .github/patches/question-progress-counter.patch && git apply .github/patches/question-progress-counter.patch

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:test --stacktrace

      - name: Commit production fix
        run: |
          rm -f .github/patches/question-progress-counter.patch
          rm -f .github/workflows/apply-question-progress-counter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show question progress counters"
          git push origin HEAD:fix/question-progress-counter
