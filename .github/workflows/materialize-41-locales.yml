name: Materialize 41 Locales

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/materialize-41-locales.yml'

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply locale scaffolding
        run: |
          python3 scripts/scaffold_six_new_locales.py
          python3 scripts/scaffold_41_new_locales.py

      - name: Download verified generated catalogs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32564918830
          pattern: production-locales-*
          path: build/generated-locales
          merge-multiple: true

      - name: Install generated catalogs
        run: cp build/generated-locales/*.kt app/src/main/java/com/example/ui/

      - name: Fix Serbian placeholder regression and harden generator
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('app/src/main/java/com/example/ui')
          serbian = ui / 'SerbianContent.kt'
          text = serbian.read_text(encoding='utf-8')
          text = text.replace(r'\\ХАРМОНИПЛАЦЕХОЛДЕР00', r'\${profile.partnerName}')
          serbian.write_text(text, encoding='utf-8')

          generator = Path('scripts/generate_production_locale_catalogs.py')
          text = generator.read_text(encoding='utf-8')
          old = 'token = f"HARMONYPLACEHOLDER{len(placeholders):02d}"'
          new = 'token = f"⟦{len(placeholders):02d}⟧"'
          if old not in text and new not in text:
              raise SystemExit('generator placeholder token line not found')
          text = text.replace(old, new)
          generator.write_text(text, encoding='utf-8')

          regression = Path('scripts/verify_production_locale_generator.py')
          text = regression.read_text(encoding='utf-8')
          if 'placeholder protection token contains alphabetic characters' not in text:
              needle = '    protected, placeholders = module.protect(sample)\n'
              addition = (
                  needle
                  + '    if any(ch.isalpha() for ch in protected if ch not in sample.replace("$name", "").replace("${profile.partnerName}", "").replace("{count}", "").replace("%1$s", "").replace("%d", "")):\n'
                  + '        fail("placeholder protection token contains alphabetic characters and can be transliterated")\n'
              )
              if needle not in text:
                  raise SystemExit('generator regression insertion point not found')
              text = text.replace(needle, addition, 1)
          regression.write_text(text, encoding='utf-8')
          PY

          python3 scripts/repair_generated_locale_sources.py
          python3 scripts/repair_build_blockers.py

      - name: Verify generator and locale wiring
        run: |
          python3 scripts/verify_production_locale_generator.py
          python3 scripts/verify_ptbr_ready.py
          python3 scripts/verify_six_new_locales.py
          python3 scripts/verify_41_new_locales.py
          python3 scripts/verify_rtl_locales.py

      - name: Audit complete localization
        run: |
          python3 scripts/audit_localization.py
          python3 scripts/audit_41_locales.py
          python3 scripts/verify_localization_repair.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Persist complete 41-locale implementation
        run: |
          git config user.name "harmony-localization-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/materialize-41-locales.yml
          git add app/src/main/java/com/example/ui scripts/generate_production_locale_catalogs.py scripts/verify_production_locale_generator.py
          git commit -m "Add 41 complete production locale catalogs"
          git push origin HEAD:${{ github.head_ref }}
