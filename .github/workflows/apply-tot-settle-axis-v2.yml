name: Apply Tot Settle Rotation Axis

on:
  push:
    branches:
      - fix/tot-settle-rotation-axis-v2
    paths:
      - 'scripts/apply_tot_settle_axis_v2.py'
      - '.github/workflows/apply-tot-settle-axis-v2.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tot-settle-rotation-axis-v2
          fetch-depth: 0
      - name: Apply focused animation patch
        run: python3 scripts/apply_tot_settle_axis_v2.py
      - name: Verify rotation-axis-only settle
        run: python3 scripts/verify_tot_settle_wobble.py
      - name: Verify old converge remains removed
        run: python3 scripts/verify_tot_no_final_reentry.py
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon
      - name: Commit verified focused change
        run: |
          git config user.name "harmony-animation-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/apply_tot_settle_axis_v2.py .github/workflows/apply-tot-settle-axis-v2.yml
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt scripts/verify_tot_settle_wobble.py
          git commit -m "fix: align Das-oder-das settle with rotation direction"
          git push origin HEAD:fix/tot-settle-rotation-axis-v2
