name: Apply Nähe Materialize Animation

on:
  push:
    branches:
      - feat/naehe-materialize-animation
    paths:
      - 'scripts/apply_naehe_materialize_animation.py'
      - '.github/workflows/apply-naehe-materialize-animation.yml'

permissions:
  contents: write

jobs:
  apply-verify-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/naehe-materialize-animation
          fetch-depth: 0

      - name: Apply targeted animation patch
        run: python3 scripts/apply_naehe_materialize_animation.py

      - name: Verify targeted animation behavior
        run: python3 scripts/verify_naehe_materialize_animation.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit verified implementation and remove one-shot helpers
        run: |
          git config user.name "harmony-naehe-animation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          git rm scripts/apply_naehe_materialize_animation.py
          git rm .github/workflows/apply-naehe-materialize-animation.yml
          git commit -m "feat: animate Nähe & Intimität question flow"
          git push origin HEAD:feat/naehe-materialize-animation
