name: Verify Nähe Cinematic Glitch

on:
  push:
    branches:
      - feat/naehe-cinematic-glitch-v2
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/naehe-cinematic-glitch-v2
          fetch-depth: 0

      - name: Apply cinematic implementation
        run: python3 scripts/apply_naehe_cinematic_glitch.py

      - name: Verify cinematic source requirements
        run: python3 scripts/verify_naehe_cinematic_glitch.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Upload verified QuizRunner
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-quizrunner
          path: app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          if-no-files-found: error
