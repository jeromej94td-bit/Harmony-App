name: Verify Nähe Cinematic Glitch

on:
  push:
    branches:
      - feat/naehe-cinematic-glitch-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/naehe-cinematic-glitch-v2
          fetch-depth: 0

      - name: Apply cinematic implementation
        run: python3 scripts/apply_naehe_cinematic_glitch.py

      - name: Verify cinematic source requirements
        run: python3 scripts/verify_naehe_cinematic_glitch.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Upload verified QuizRunner
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-quizrunner
          path: app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          if-no-files-found: error

      - name: Persist verified source
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt; then
            echo "Source already persisted"
            exit 0
          fi
          git config user.name "harmony-cinematic-glitch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          git commit -m "feat: add cinematic glitch materialization to Nähe"
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/naehe-cinematic-glitch-v2
            git rebase origin/feat/naehe-cinematic-glitch-v2
            if git push origin HEAD:feat/naehe-cinematic-glitch-v2; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying"
            sleep 3
          done
          exit 1
