name: Verify Nähe Cinematic Glitch

on:
  push:
    branches:
      - feat/naehe-cinematic-glitch-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/naehe-cinematic-glitch-v2
          fetch-depth: 0

      - name: Apply cinematic implementation
        run: python3 scripts/apply_naehe_cinematic_glitch.py

      - name: Verify cinematic source requirements
        run: python3 scripts/verify_naehe_cinematic_glitch.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Upload verified QuizRunner
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-quizrunner
          path: app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          if-no-files-found: error

      - name: Publish clean final branch
        if: github.event_name == 'push'
        run: |
          cp app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt /tmp/QuizRunnerScreen.kt
          git config user.name "harmony-cinematic-glitch-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout -B agent/naehe-cinematic-final origin/main
          cp /tmp/QuizRunnerScreen.kt app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          git commit -m "feat: cinematic Nähe transformer materialization"
          git push --force origin HEAD:agent/naehe-cinematic-final
