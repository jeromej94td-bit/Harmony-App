name: Verify Egg Cooking Game

on:
  push:
    branches:
      - feat/egg-cooking-game
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply egg cooking implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_egg_cooking_game.py')
          text = path.read_text(encoding='utf-8')
          old = "parts.append(bytes.fromhex((ROOT / 'scripts/egg_asset_chunks/part06.hex.txt').read_text(encoding='utf-8').strip()).decode('utf-8'))"
          new = "tail_hex = (ROOT / 'scripts/egg_asset_chunks/part06a.hex.txt').read_text(encoding='utf-8').strip() + (ROOT / 'scripts/egg_asset_chunks/part06b.hex.txt').read_text(encoding='utf-8').strip()\nparts.append(bytes.fromhex(tail_hex).decode('utf-8'))"
          if old not in text:
              raise SystemExit('final chunk reader anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/apply_egg_cooking_game.py
      - name: Verify egg cooking game invariants
        run: python3 scripts/verify_egg_cooking_game.py
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon
      - name: Commit verified production files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/model/Models.kt \
                  app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt \
                  app/src/main/res/drawable-nodpi/egg_cooking_guide.webp
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "feat: add animated egg cooking preference question"
            git push
          fi
