name: Tot Settle Axis Check

on:
  push:
    branches:
      - fix/tot-settle-rotation-axis-20260822

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tot-settle-rotation-axis-20260822
          fetch-depth: 0
      - name: Apply exact settle-axis patch
        run: python3 scripts/apply_tot_settle_axis.py
      - name: Verify post-shuffle settle axis
        run: python3 scripts/verify_tot_settle_wobble.py
      - name: Verify removed converge stays removed
        run: python3 scripts/verify_tot_no_final_reentry.py
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon
      - name: Commit verified change and remove temporary helpers
        run: |
          git config user.name "harmony-animation-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/apply_tot_settle_axis.py .github/workflows/tot-settle-axis-check.yml
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt scripts/verify_tot_settle_wobble.py
          git commit -m "fix: align Das-oder-das settle with card rotation"
          git push origin HEAD:fix/tot-settle-rotation-axis-20260822
