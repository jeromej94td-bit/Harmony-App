name: Finalize Nähe Cinematic Glitch

on:
  push:
    branches:
      - agent/naehe-cinematic-final2
    paths:
      - '.github/workflows/finalize-naehe-cinematic-glitch.yml'
      - 'scripts/apply_naehe_cinematic_glitch.py'
      - 'scripts/verify_naehe_cinematic_glitch.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/naehe-cinematic-final2
          fetch-depth: 0

      - name: Apply cinematic implementation
        run: python3 scripts/apply_naehe_cinematic_glitch.py

      - name: Verify cinematic source requirements
        run: python3 scripts/verify_naehe_cinematic_glitch.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit clean verified implementation
        run: |
          git config user.name "harmony-cinematic-glitch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          git rm scripts/apply_naehe_cinematic_glitch.py
          git rm scripts/verify_naehe_cinematic_glitch.py
          git rm .github/workflows/apply-naehe-cinematic-glitch.yml
          git rm .github/workflows/finalize-naehe-cinematic-glitch.yml
          git commit -m "feat: cinematic Nähe transformer materialization"
          git push origin HEAD:agent/naehe-cinematic-final2
