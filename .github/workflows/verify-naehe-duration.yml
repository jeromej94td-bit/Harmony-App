name: Verify and Apply Nähe Animation Timing

on:
  push:
    branches:
      - fix/naehe-animation-1-9s
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/naehe-animation-1-9s
          fetch-depth: 0
      - name: Apply requested timing changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt')
          source = path.read_text(encoding='utf-8')

          old_question = 'totalDurationMillis = 3_200,'
          new_question = 'totalDurationMillis = 1_900,'
          old_answers = 'delayMillis = 760 + optIdx * 210,'
          new_answers = 'delayMillis = 760 + optIdx * 500,'

          if source.count(old_question) != 1:
              raise SystemExit(f'Expected exactly one 3.2s question duration, found {source.count(old_question)}')
          if source.count(old_answers) != 1:
              raise SystemExit(f'Expected exactly one 210ms answer stagger, found {source.count(old_answers)}')

          source = source.replace(old_question, new_question, 1)
          source = source.replace(old_answers, new_answers, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Verify requested timing
        run: python3 scripts/verify_naehe_question_duration.py
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon
      - name: Commit verified source and remove helper files
        run: |
          git config user.name "harmony-timing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          git rm -f .github/workflows/verify-naehe-duration.yml .github/workflows/apply-naehe-timing.yml scripts/verify_naehe_question_duration.py
          git commit -m "fix: shorten intimacy materialization timing"
          git push origin HEAD:fix/naehe-animation-1-9s
