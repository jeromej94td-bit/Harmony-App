name: Verify Nähe Animation Duration

on:
  push:
    branches:
      - fix/naehe-animation-1-9s
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 1.9s question duration
        run: python3 scripts/verify_naehe_question_duration.py
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon
