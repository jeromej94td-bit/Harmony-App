name: Verify Merlin theme against approved video audio

on:
  push:
    branches:
      - fix/introspection-real-audio-final
    paths:
      - '.github/workflows/verify-merlin-theme.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical Merlin audio fingerprint
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 - <<'PY'
          import subprocess, math, struct, sys
          path='app/src/main/res/raw/merlin_theme.mp3'
          expected_rms=[0.2523,0.2776,0.2889,0.3308,0.4097,0.3919,0.7704,0.5531,0.7279,0.9147,0.7694,1.0008,1.3833,1.0277,1.0763,0.8245,0.7602,0.8397,1.0547,1.2656,0.8764,0.8313,0.7633,0.687,0.7476,1.0093,0.8326,0.9729,0.9259,1.1526,0.7243,0.7951,1.1585,1.3368,1.032,0.7276,0.5153,0.7659,1.0937,1.1285,1.1813,1.1732,1.1763,1.1192,1.1823,1.4141,1.7711,1.3558,0.8122,0.9194,1.859,1.2001,1.4213,1.8224,1.427,1.4316,2.0083,2.203,1.7688,1.9201,0.2391,0.2821,0.3162]
          expected_zcr=[0.0655,0.1315,0.1353,0.1214,0.142,0.1558,0.0854,0.1253,0.1339,0.1084,0.1026,0.0899,0.092,0.0943,0.1378,0.1484,0.118,0.1183,0.1258,0.119,0.1239,0.094,0.0869,0.1644,0.1719,0.1549,0.0944,0.0909,0.1311,0.1293,0.1518,0.1318,0.1349,0.1273,0.074,0.0803,0.0828,0.1015,0.1394,0.0896,0.0976,0.0871,0.0966,0.0946,0.1226,0.1034,0.0931,0.0529,0.0714,0.0614,0.0378,0.0609,0.071,0.0649,0.061,0.0936,0.0686,0.09,0.0865,0.0615,0.1143,0.1344,0.1336]
          raw=subprocess.check_output(['ffmpeg','-hide_banner','-loglevel','error','-i',path,'-f','s16le','-ac','1','-ar','8000','-'])
          vals=struct.unpack('<%dh'%(len(raw)//2),raw)
          sec=8000; rms=[]; zcr=[]
          for off in range(0,len(vals),sec):
              y=vals[off:off+sec]
              if len(y)<sec//2: break
              rms.append(math.sqrt(sum(v*v for v in y)/len(y))+1e-9)
              zcr.append(sum((y[j]<0)!=(y[j-1]<0) for j in range(1,len(y)))/(len(y)-1))
          mean=sum(rms)/len(rms); rms=[v/mean for v in rms]
          def corr(a,b):
              n=min(len(a),len(b)); a=a[:n]; b=b[:n]
              ma=sum(a)/n; mb=sum(b)/n
              num=sum((x-ma)*(y-mb) for x,y in zip(a,b))
              da=math.sqrt(sum((x-ma)**2 for x in a)); db=math.sqrt(sum((y-mb)**2 for y in b))
              return num/(da*db+1e-12)
          cr=corr(rms,expected_rms); cz=corr(zcr,expected_zcr)
          print(f'seconds={len(rms)} rms_corr={cr:.6f} zcr_corr={cz:.6f}')
          if abs(len(rms)-63)>1 or cr < 0.965 or cz < 0.70:
              print('MERLIN_FINGERPRINT_MISMATCH')
              sys.exit(1)
          print('MERLIN_FINGERPRINT_MATCH')
          PY
