name: Temporary Apply Nähe Materialize

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_naehe_materialize_animation.py'
      - 'scripts/trigger_naehe_materialize.txt'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/naehe-materialize-animation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/naehe-materialize-animation
          fetch-depth: 0

      - name: Apply targeted animation patch
        run: python3 scripts/apply_naehe_materialize_animation.py

      - name: Verify targeted animation behavior
        run: python3 scripts/verify_naehe_materialize_animation.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit implementation
        run: |
          git config user.name "harmony-naehe-animation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt
          git commit -m "feat: animate Nähe & Intimität question flow"
          git pull --rebase origin feat/naehe-materialize-animation
          git push origin HEAD:feat/naehe-materialize-animation
